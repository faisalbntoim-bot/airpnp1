name: Backend CI

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies (clean)
        run: npm ci

      - name: Prisma — validate schema
        env:
            DATABASE_URL: 'file:./test.db'
        run: npx prisma validate

      - name: Prisma — generate client
        env:
          DATABASE_URL: 'file:./test.db'
        run: npx prisma generate

      - name: TypeScript — noEmit type check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Vitest — full suite
        env:
          NODE_ENV: test
          DATABASE_URL: 'file:./test.db'
          PAYMENT_PROVIDER: sandbox
          MONEY_ROUNDING: banker
          DEFAULT_PLATFORM_FEE_PERCENT: '5'
          DEFAULT_TAX_RATE_PERCENT: '15'
        run: npm test -- --reporter=default

      - name: Build (tsc emit)
        run: npm run build

      - name: Security — dependency audit (advisory only)
        # `|| true` — audit noise never fails the build. The report is uploaded as
        # an artifact so a human can review; upgrading is a separate PR.
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-artifacts-${{ matrix.node }}
          path: |
            backend/npm-audit.json
            backend/dist/
          if-no-files-found: warn
